
services:
  api:
    build: .
    container_name: pokemon-api
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: sqlite:////data/pokemon.db
    volumes:
      - pokemon_data:/data

  redis:
    image: redis:7-alpine
    container_name: pokemon-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  pokemon_data:
  redis_data: